name: Nuevo prefijo o corrección
description: Aporta un prefijo, un banco o un producto que falta, o corrige uno que está mal.
title: "[prefijo] "
labels: ["datos"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Nunca escribas un número de tarjeta completo.** Bastan los 9 primeros dígitos.
  - type: input
    id: prefix
    attributes:
      label: Primeros dígitos
      description: Solo los 9 primeros (red, producto, banco y SMPE), o los 4 primeros si no los tienes.
      placeholder: "9205 06 999"
    validations:
      required: true
  - type: dropdown
    id: bank
    attributes:
      label: Banco
      options:
        - BANDEC
        - BPA
        - Banco Metropolitano
        - BICSA
        - FINCIMEX (Clásica)
        - AIS
        - Otro
        - No lo sé
    validations:
      required: true
  - type: dropdown
    id: currency
    attributes:
      label: Moneda
      options:
        - CUP
        - USD con respaldo en MLC
        - USD
        - No lo sé
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Producto o propósito
      description: Por ejemplo nómina, ahorro, TCP, MIPYME, jubilación.
  - type: textarea
    id: source
    attributes:
      label: Fuente
      description: Un enlace, un documento o «tengo esta tarjeta».
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: No he escrito ningún número de tarjeta completo ni datos personales.
          required: true
